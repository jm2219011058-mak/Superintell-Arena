# Render Blueprint - deploys the Flask backend from this repo.
# In Render: New -> Blueprint -> select this repo.
# Secrets marked sync:false are prompted for in the dashboard on first deploy.
services:
  - type: web
    name: arena-backend
    runtime: python
    rootDir: arena-backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_PORT
        value: "10000"
      - key: FLASK_DEBUG
        value: "False"
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL_NAME
        value: claude-sonnet-5
      - key: LLM_API_KEY
        sync: false
      - key: ZEP_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
