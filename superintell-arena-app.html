<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Superintell Arena</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root { color-scheme: light; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:#0a0a0f; color:#e4e4ed; overflow-x:hidden; }
button { font-family:inherit; cursor:pointer; }
input { font-family:inherit; }

/* Tokens */
:root {
  --bg:#0a0a0f; --card:#12121a; --hover:#1a1a2e;
  --border:#1e1e30; --border-h:#2a2a44;
  --text:#e4e4ed; --sec:#8888a0; --muted:#55556a;
  --accent:#6c5ce7; --accent-h:#7c6cf7; --accent-dim:rgba(108,92,231,0.12);
  --green:#00b894; --red:#e17055; --orange:#fdcb6e; --blue:#74b9ff; --purple:#a29bfe;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}

.screen { display:none; min-height:100vh; padding:32px 20px; max-width:860px; margin:0 auto; }
.screen.active { display:block; }

/* FadeIn */
.fi { opacity:0; transform:translateY(8px); transition: opacity .3s var(--ease-out), transform .3s var(--ease-out); }
.fi.show { opacity:1; transform:translateY(0); }

/* Search */
.search-box { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 16px; margin-bottom:16px; }
.search-box input { background:none; border:none; outline:none; color:var(--text); font-size:14px; width:100%; }

/* Filter pills */
.pills { display:flex; gap:5px; flex-wrap:wrap; }
.pill { padding:5px 12px; border-radius:18px; font-size:12px; font-weight:500; border:none; transition:all .16s var(--ease-out); }
.pill.on { background:var(--accent); color:#fff; }
.pill.off { background:var(--card); color:var(--sec); }
.sort-pill { padding:4px 9px; border-radius:7px; font-size:11px; background:transparent; transition:all .16s var(--ease-out); }
.sort-pill.on { border:1px solid var(--accent); color:var(--accent); }
.sort-pill.off { border:1px solid var(--border); color:var(--muted); }

/* Topic card */
.topic-card { width:100%; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 20px; transition:all .2s var(--ease-out); display:flex; gap:16px; margin-bottom:10px; }
.topic-card:hover { border-color:var(--border-h); transform:translateY(-1px); }
.topic-card:active { transform:scale(0.97); }
.tc-icon { width:40px; height:40px; border-radius:10px; background:var(--accent-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:18px; }
.tc-cat { font-size:11px; color:var(--muted); }
.tc-heat { display:flex; align-items:center; gap:4px; font-size:11px; font-weight:600; }
.tc-title { font-size:15px; font-weight:700; color:var(--text); line-height:1.35; margin:4px 0 6px; letter-spacing:-0.01em; }
.tc-desc { font-size:12px; color:var(--sec); line-height:1.5; margin-bottom:10px; }
.tag { padding:2px 7px; border-radius:5px; font-size:10px; background:rgba(108,92,231,0.08); color:var(--purple); margin-right:4px; display:inline-block; }
.agent-dot { width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; border:2px solid var(--card); margin-left:-5px; }
.agent-dot:first-child { margin-left:0; }

/* Pipeline */
.pipe-step { display:flex; gap:16px; margin-bottom:24px; position:relative; padding-left:32px; }
.pipe-line { position:absolute; left:11px; top:0; bottom:0; width:2px; background:var(--border); }
.pipe-dot { position:absolute; left:2px; top:4px; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:all .3s var(--ease-out); font-size:11px; }
.pipe-dot.done { background:var(--accent); border:2px solid var(--accent); color:#fff; }
.pipe-dot.active { background:rgba(108,92,231,0.27); border:2px solid var(--accent); }
.pipe-dot.pending { background:var(--card); border:2px solid var(--border); }
.pipe-label { font-size:13px; font-weight:600; }
.pipe-desc { font-size:12px; color:var(--sec); }
.pipe-detail { margin-top:10px; padding:12px; background:var(--bg); border-radius:8px; border:1px solid var(--border); font-size:11px; color:var(--muted); font-family:monospace; line-height:1.7; }

/* Arena */
.round-tabs { display:flex; gap:6px; padding:12px 0; border-bottom:1px solid var(--border); }
.round-tab { flex:1; padding:8px 0; border-radius:8px; font-size:11px; font-weight:600; border:1px solid transparent; background:transparent; color:var(--muted); transition:all .16s var(--ease-out); }
.round-tab.on { background:var(--accent-dim); color:var(--accent); border-color:rgba(108,92,231,0.2); }
.msg { margin-bottom:14px; padding:16px; background:var(--card); border-radius:12px; border:1px solid var(--border); border-left:3px solid var(--accent); }
.msg-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.msg-avatar { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; }
.msg-name { font-size:12px; font-weight:700; color:var(--text); }
.msg-style { font-size:10px; }
.stance-badge { padding:2px 8px; border-radius:16px; font-size:10px; font-weight:600; }
.msg-text { font-size:13px; color:var(--text); line-height:1.7; }

/* Typing indicator */
.typing { display:flex; align-items:center; gap:6px; padding:10px 16px; color:var(--muted); font-size:12px; }
.typing-dots { display:flex; gap:2px; }
.typing-dots span { width:5px; height:5px; border-radius:50%; background:var(--accent); animation:pulse 1s infinite; }
.typing-dots span:nth-child(2) { animation-delay:.15s; }
.typing-dots span:nth-child(3) { animation-delay:.3s; }
@keyframes pulse { 0%,100%{opacity:.3;transform:scale(.8)} 50%{opacity:1;transform:scale(1)} }

/* Report */
.insight-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
.insight-icon { width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:13px; }
.insight-title { font-size:12px; font-weight:700; color:var(--text); }
.insight-text { font-size:12px; color:var(--sec); line-height:1.6; margin-top:8px; }
.chart-box { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; }
.cross-row { display:flex; align-items:center; gap:10px; padding:8px 0; flex-wrap:wrap; font-size:11px; }
.arch-tag { padding:6px 10px; background:var(--card); border-radius:8px; font-size:10px; display:inline-block; margin:3px; }

/* Buttons */
.btn-primary { padding:10px 24px; border-radius:10px; font-size:13px; font-weight:600; background:var(--accent); color:#fff; border:none; transition:transform .16s var(--ease-out); }
.btn-primary:active { transform:scale(0.97); }
.btn-back { display:flex; align-items:center; gap:4px; color:var(--sec); background:none; border:none; font-size:13px; margin-bottom:20px; }

.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
@media(max-width:600px) { .grid-2 { grid-template-columns:1fr; } }
</style>
</head>
<body>

<!-- ═══ SCREEN 1: TOPIC HUB ═══ -->
<div id="s-topics" class="screen active">
  <div class="fi" style="text-align:center;margin-bottom:32px">
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px">
      <span style="font-size:26px">✨</span>
      <h1 style="font-size:28px;font-weight:800;letter-spacing:-0.03em">Superintell Arena</h1>
    </div>
    <p style="color:var(--sec);font-size:14px">基于 MiroFish + OASIS 的跨学科辩证沙盒</p>

      <span style="font-size:11px;color:var(--muted)">🗄 Zep GraphRAG</span>
      <span style="font-size:11px;color:var(--muted)">⚡ OASIS 引擎</span>
      <span style="font-size:11px;color:var(--muted)">🔀 MiroFish 管线</span>

  </div>
  <div class="search-box fi">
    <span style="color:var(--muted)">🔍</span>

  </div>
  <div class="fi" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">

    <div id="sort-pills" style="display:flex;gap:5px;align-items:center"><span style="font-size:11px;color:var(--muted)">🔽</span></div>
  </div>
  <div id="topic-list"></div>
</div>

<!-- ═══ SCREEN 2: PIPELINE ═══ -->
<div id="s-pipeline" class="screen">
  <button class="btn-back" onclick="go('topics')">← 返回议题</button>
  <div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:28px">
    <span style="font-size:10px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:0.06em">MiroFish 管线启动</span>
    <h2 id="pipe-title" style="font-size:20px;font-weight:800;margin-top:6px;letter-spacing:-0.02em"></h2>
  </div>
  <div id="pipe-steps" style="position:relative">
    <div class="pipe-line"></div>
  </div>
  <div id="pipe-cta" style="text-align:center;margin-top:20px;display:none">
    <button class="btn-primary" onclick="goArena()">▶ 进入辩论 Arena</button>
  </div>
</div>

<!-- ═══ SCREEN 3: ARENA ═══ -->
<div id="s-arena" class="screen" style="padding-top:0">
  <div style="padding:16px 0 10px;border-bottom:1px solid var(--border)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <button class="btn-back" style="margin:0" onclick="go('pipeline')">← 返回</button>
      <div style="display:flex;gap:8px;align-items:center">
        <span style="font-size:10px;color:var(--muted)">OASIS SimulationRunner</span>
        <span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block"></span>
      </div>
    </div>
    <h2 id="arena-title" style="font-size:17px;font-weight:800;margin-top:6px;letter-spacing:-0.02em"></h2>
  </div>
  <div id="round-tabs" class="round-tabs"></div>
  <div id="arena-msgs" style="flex:1;overflow:auto;padding:14px 0"></div>
  <div id="arena-bottom" style="padding:12px 0 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
    <span id="arena-status" style="font-size:10px;color:var(--muted)"></span>
    <button id="arena-next-btn" class="btn-primary" style="display:none;font-size:12px;padding:8px 20px"></button>
  </div>
</div>

<!-- ═══ SCREEN 4: REPORT ═══ -->
<div id="s-report" class="screen">
  <div style="text-align:center;margin-bottom:32px">
    <div style="display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:16px;background:var(--accent-dim);margin-bottom:10px">
      <span style="font-size:13px">📊</span>
      <span style="font-size:11px;color:var(--accent);font-weight:600">ReportAgent 输出</span>
    </div>
    <h1 id="report-title" style="font-size:22px;font-weight:800;letter-spacing:-0.02em"></h1>
    <p id="report-sub" style="font-size:12px;color:var(--sec);margin-top:4px"></p>
  </div>
  <div id="report-insights" class="grid-2" style="margin-bottom:24px"></div>
  <div class="grid-2" style="margin-bottom:24px">
    <div class="chart-box">
      <h3 style="font-size:12px;font-weight:700;margin-bottom:10px">多维共识分析</h3>
      <div style="font-size:10px;color:var(--muted);margin-bottom:6px"><span style="color:var(--accent)">■</span> 乐观派 &nbsp; <span style="color:var(--green)">■</span> 审慎派</div>
      <canvas id="radarChart" style="max-height:220px"></canvas>
    </div>
    <div class="chart-box">
      <h3 style="font-size:12px;font-weight:700;margin-bottom:10px">立场光谱 (反对 ← → 支持)</h3>
      <canvas id="barChart" style="max-height:220px"></canvas>
    </div>
  </div>
  <div id="report-cross" class="chart-box" style="margin-bottom:24px"></div>
  <div id="report-arch" style="background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:24px"></div>
  <div style="text-align:center;padding-bottom:40px">
    <button class="btn-primary" onclick="go('topics');currentTopic=null">🔄 新辩论</button>
  </div>
</div>

<script>

// ─── STATE ─────────────────────────────────────────────────────────────
let currentCat = "全部", currentSort = "热度", currentTopic = null;
let currentRound = 0, revealCount = 0, isTyping = false, typingTimer = null;
let radarChartInst = null, barChartInst = null;

// ─── NAVIGATION ────────────────────────────────────────────────────────
function go(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('s-'+screen).classList.add('active');
  window.scrollTo(0,0);
  if (screen === 'topics') renderTopics();
  if (screen === 'report') renderReport();
}

// ─── FADE IN ───────────────────────────────────────────────────────────
function fadeInAll(container) {
  const els = container.querySelectorAll('.fi');
  els.forEach((el, i) => {
    setTimeout(() => el.classList.add('show'), 40 + i * 35);
  });
}

// ─── TOPIC HUB ─────────────────────────────────────────────────────────
function renderTopics() {
  // Categories
  const cp = document.getElementById('cat-pills');
  cp.innerHTML = CATS.map(c =>
    `<button class="pill ${c===currentCat?'on':'off'}" onclick="currentCat='${c}';renderTopics()">${c}</button>`
  ).join('');
  // Sort
  const sp = document.getElementById('sort-pills');
  sp.innerHTML = '<span style="font-size:11px;color:var(--muted)">🔽</span>' +
    SORTS.map(s =>
      `<button class="sort-pill ${s===currentSort?'on':'off'}" onclick="currentSort='${s}';renderTopics()">${s}</button>`
    ).join('');
  // Filter + sort topics
  const q = (document.getElementById('topic-search').value||'').toLowerCase();
  let ts = TOPICS.filter(t => currentCat==='全部' || t.cat===currentCat);
  if (q) ts = ts.filter(t => t.title.includes(q)||t.desc.includes(q)||t.discs.some(d=>d.includes(q)));
  if (currentSort==='热度') ts.sort((a,b)=>b.heat-a.heat);
  if (currentSort==='学科交叉度') ts.sort((a,b)=>b.discs.length-a.discs.length);
  if (currentSort==='争议度') ts.sort((a,b)=>b.agents.length-a.agents.length);

  const list = document.getElementById('topic-list');
  list.innerHTML = ts.map(t => {
    const hc = t.heat>90?'var(--red)':t.heat>80?'var(--orange)':'var(--muted)';
    const dots = t.agents.slice(0,4).map((aid,j) => {
      const a = AGENTS[aid];
      return `<span class="agent-dot" style="background:${a.color}">${a.emoji}</span>`;
    }).join('') + (t.agents.length>4?`<span style="font-size:10px;color:var(--muted);margin-left:3px">+${t.agents.length-4}</span>`:'');
    return `<button class="topic-card fi" onclick='selectTopic("${t.id}")'>
      <div class="tc-icon">${t.icon}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span class="tc-cat">${t.cat}</span>
          <div class="tc-heat" style="color:${hc}">🔥 ${t.heat}</div>
        </div>
        <div class="tc-title">${t.title}</div>
        <div class="tc-desc">${t.desc}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>${t.discs.map(d=>`<span class="tag">${d}</span>`).join('')}</div>
          <div style="display:flex;align-items:center">${dots}</div>
        </div>
      </div>
    </button>`;
  }).join('');
  fadeInAll(document.getElementById('s-topics'));
}

function selectTopic(id) {
  currentTopic = TOPICS.find(t=>t.id===id);
  go('pipeline');
  runPipeline();
}

// ─── PIPELINE ──────────────────────────────────────────────────────────
const PIPE_STEPS = [
  {key:"ontology",label:"本体论构建",desc:"分析议题，提取辩论实体和关系类型",icon:"🗄",dur:1800},
  {key:"graph",label:"知识图谱注入",desc:"将Agent知识源注入Zep GraphRAG",icon:"🔗",dur:2500},
  {key:"profile",label:"Agent人设生成",desc:"从图谱节点生成深度辩论人设",icon:"👥",dur:2000},
  {key:"config",label:"辩论参数配置",desc:"自动生成辩证结构和交互规则",icon:"⚙️",dur:1200},
  {key:"ready",label:"沙盒就绪",desc:"OASIS引擎初始化完成",icon:"▶",dur:600},
];

function runPipeline() {
  if (!currentTopic) return;
  document.getElementById('pipe-title').textContent = currentTopic.title;
  document.getElementById('pipe-cta').style.display = 'none';
  const container = document.getElementById('pipe-steps');
  const matched = currentTopic.agents.map(id=>AGENTS[id]);

  container.innerHTML = '<div class="pipe-line"></div>' + PIPE_STEPS.map((s,i) => {
    let detail = '';
    if (i===0) detail = `<div class="pipe-detail" style="display:none" id="pd-${i}">→ 提取辩论实体类型: Technologist, Investor, Philosopher...<br>→ 关系类型: CHALLENGES, SUPPORTS, SYNTHESIZES_WITH...<br>→ 基于 MiroFish OntologyGenerator 自适应生成</div>`;
    if (i===1) detail = `<div class="pipe-detail" style="display:none" id="pd-${i}">${matched.slice(0,3).map(a=>`→ 注入 ${a.name}: ${a.sources[0]}`).join('<br>')}<br>→ Zep GraphRAG 构建知识图谱中... (${matched.length*3} 个知识节点)</div>`;
    if (i===2) detail = `<div style="display:none;margin-top:10px;display:flex;gap:6px;flex-wrap:wrap" id="pd-${i}">${matched.map(a=>`<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:${a.color}15;border-radius:8px;font-size:11px;color:${a.color}">${a.emoji} ${a.name}</span>`).join('')}</div>`;
    if (i===3) detail = `<div class="pipe-detail" style="display:none" id="pd-${i}">→ 辩论结构: 3轮 (开局立论 → 交叉质疑 → 辩证综合)<br>→ 动作空间: ARGUE, CHALLENGE, CONCEDE, SYNTHESIZE, PREDICT<br>→ 记忆回写: 每轮结束后 ZepGraphMemoryUpdater 更新图谱</div>`;
    return `<div class="pipe-step fi">
      <div class="pipe-dot pending" id="dot-${i}"></div>
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span>${s.icon}</span>
          <span class="pipe-label" id="pl-${i}" style="color:var(--muted)">${s.label}</span>
          <span id="loader-${i}" style="display:none;font-size:11px">⟳</span>
        </div>
        <p class="pipe-desc">${s.desc}</p>
        ${detail}
      </div>
    </div>`;
  }).join('');

  fadeInAll(container);

  // Animate steps
  let step = 0;
  function nextStep() {
    if (step >= PIPE_STEPS.length) {
      document.getElementById('pipe-cta').style.display = '';
      return;
    }
    // Set previous as done
    if (step > 0) {
      const pd = document.getElementById('dot-'+(step-1));
      pd.className = 'pipe-dot done'; pd.textContent = '✓';
      const pl = document.getElementById('pl-'+(step-1));
      pl.style.color = 'var(--text)';
      document.getElementById('loader-'+(step-1)).style.display = 'none';
      const prevDetail = document.getElementById('pd-'+(step-1));
      if (prevDetail) prevDetail.style.display = 'none';
    }
    // Set current as active
    const dot = document.getElementById('dot-'+step);
    dot.className = 'pipe-dot active'; dot.innerHTML = '<span style="width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1s infinite"></span>';
    document.getElementById('pl-'+step).style.color = 'var(--text)';
    document.getElementById('loader-'+step).style.display = 'inline';
    const detail = document.getElementById('pd-'+step);
    if (detail) detail.style.display = '';

    step++;
    setTimeout(nextStep, PIPE_STEPS[step-1].dur);
  }
  setTimeout(nextStep, 300);
}

function goArena() {
  currentRound = 0;
  go('arena');
  renderArena();
}

// ─── ARENA ─────────────────────────────────────────────────────────────
function renderArena() {
  if (!currentTopic) return;
  const rounds = DEBATE_DATA[currentTopic.id] || DEBATE_DATA.t1;
  document.getElementById('arena-title').textContent = currentTopic.title;

  // Tabs
  document.getElementById('round-tabs').innerHTML = rounds.map((r,i) =>
    `<button class="round-tab ${i===currentRound?'on':''}" onclick="if(!isTyping||${i}<=${currentRound}){currentRound=${i};renderArena()}">${r.label}<div style="font-size:10px;font-weight:400;margin-top:1px;opacity:.7">${r.phase}</div></button>`
  ).join('');

  const r = rounds[currentRound];
  const keys = Object.keys(r.responses);
  const msgBox = document.getElementById('arena-msgs');
  msgBox.innerHTML = `<div style="text-align:center;margin-bottom:14px"><span style="font-size:11px;color:var(--muted);background:var(--card);padding:4px 12px;border-radius:20px">${r.desc}</span></div>`;

  // Reveal messages one by one
  revealCount = 0; isTyping = true;
  clearInterval(typingTimer);

  function revealNext() {
    if (revealCount >= keys.length) {
      isTyping = false;
      updateArenaBottom();
      return;
    }
    const aid = keys[revealCount];
    const a = AGENTS[aid];
    const resp = r.responses[aid];
    const sc = resp.stance==='pro'?'var(--green)':resp.stance==='contra'?'var(--red)':resp.stance==='synthesis'?'var(--accent)':'var(--orange)';
    const sl = resp.stance==='pro'?'支持':resp.stance==='contra'?'反对':resp.stance==='synthesis'?'综合':'中立';

    // Remove typing indicator
    const ti = msgBox.querySelector('.typing');
    if (ti) ti.remove();

    const div = document.createElement('div');
    div.className = 'msg fi';
    div.style.borderLeftColor = a.color;
    div.innerHTML = `<div class="msg-head">
      <div style="display:flex;align-items:center;gap:8px">
        <div class="msg-avatar" style="background:${a.color}22">${a.emoji}</div>
        <div><div class="msg-name">${a.name}</div><div class="msg-style" style="color:${a.color}">${a.style}</div></div>
      </div>
      <span class="stance-badge" style="background:${sc}18;color:${sc}">${sl}</span>
    </div>
    <p class="msg-text">${resp.text}</p>`;
    msgBox.appendChild(div);
    setTimeout(() => div.classList.add('show'), 20);

    revealCount++;
    // Show typing for next
    if (revealCount < keys.length) {
      const nextA = AGENTS[keys[revealCount]];
      const tip = document.createElement('div');
      tip.className = 'typing';
      tip.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>${nextA.name} 正在推理...<span style="font-size:10px;color:var(--muted);margin-left:auto">Zep Memory 检索中</span>`;
      msgBox.appendChild(tip);
    }
    msgBox.scrollTop = msgBox.scrollHeight;
    typingTimer = setTimeout(revealNext, 1100);
  }

  // Start with typing indicator
  const firstA = AGENTS[keys[0]];
  const tip = document.createElement('div');
  tip.className = 'typing';
  tip.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>${firstA.name} 正在推理...<span style="font-size:10px;color:var(--muted);margin-left:auto">Zep Memory 检索中</span>`;
  msgBox.appendChild(tip);
  typingTimer = setTimeout(revealNext, 800);

  updateArenaBottom();
}

function updateArenaBottom() {
  const rounds = DEBATE_DATA[currentTopic.id] || DEBATE_DATA.t1;
  const agentCount = currentTopic.agents.length;
  document.getElementById('arena-status').textContent = `Round ${currentRound+1}/${rounds.length} · ${agentCount} Agents · GraphRAG 实时回写`;
  const btn = document.getElementById('arena-next-btn');
  if (isTyping) { btn.style.display = 'none'; return; }
  if (currentRound < rounds.length - 1) {
    btn.style.display = ''; btn.textContent = rounds[currentRound+1].phase + ' ▸';
    btn.onclick = () => { currentRound++; renderArena(); };
  } else {
    btn.style.display = ''; btn.textContent = '💡 ReportAgent 综合';
    btn.onclick = () => go('report');
  }
}

    </div>`).join('');

  // Architecture
  const arch = [["MiroFish OntologyGenerator","本体论自动构建"],["Zep GraphRAG","知识图谱 + 记忆"],["OASIS SimulationRunner","多Agent辩论调度"],["ZepGraphMemoryUpdater","实时记忆回写"],["ReportAgent + InsightForge","深度分析报告"]];
  document.getElementById('report-arch').innerHTML = `<h4 style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.05em">Architecture Stack</h4>` +
    arch.map(([k,v]) => `<span class="arch-tag"><span style="color:var(--accent);font-weight:600">${k}</span> <span style="color:var(--muted)">· ${v}</span></span>`).join('');

  fadeInAll(document.getElementById('s-report'));

  // Charts
  setTimeout(() => renderCharts(matched), 100);
}

function renderCharts(matched) {
  // Radar
  if (radarChartInst) radarChartInst.destroy();
  const rCtx = document.getElementById('radarChart');
  radarChartInst = new Chart(rCtx, {
    type: 'radar',
    data: {
      labels: ['技术可行性','经济影响','社会风险','时间紧迫性','伦理考量','共识程度'],
      datasets: [
        { label:'乐观派', data:[88,92,45,85,35,60], borderColor:'#6c5ce7', backgroundColor:'rgba(108,92,231,0.12)', borderWidth:2, pointRadius:3 },
        { label:'审慎派', data:[65,78,82,50,75,60], borderColor:'#00b894', backgroundColor:'rgba(0,184,148,0.08)', borderWidth:2, pointRadius:3 },
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales: { r: { beginAtZero:true, max:100, ticks:{display:false,stepSize:25}, grid:{color:'#1e1e30'}, pointLabels:{color:'#8888a0',font:{size:9}}, angleLines:{color:'#1e1e30'} } },
      plugins: { legend:{display:false} }
    }
  });

  // Bar
  if (barChartInst) barChartInst.destroy();
  const stances = {altman:85,musk:70,andreessen:80,huang:65,naval:50,munger:30,taleb:20,buffett:35,thiel:55,dalio:40};
  const bData = matched.map(a => ({name:a.name.split(' ')[0], val:stances[currentTopic.agents.find(id=>AGENTS[id]===a)]||50, col:a.color}));
  const bCtx = document.getElementById('barChart');
  barChartInst = new Chart(bCtx, {
    type: 'bar',
    data: {
      labels: bData.map(d=>d.name),
      datasets: [{ data:bData.map(d=>d.val), backgroundColor:bData.map(d=>d.col+'aa'), borderRadius:4, barThickness:14 }]
    },
    options: {
      responsive:true, maintainAspectRatio:false, indexAxis:'y',
      scales: { x:{min:0,max:100,ticks:{color:'#55556a',font:{size:9}},grid:{color:'#1e1e30'}}, y:{ticks:{color:'#8888a0',font:{size:10}},grid:{display:false}} },
      plugins: { legend:{display:false} }
    }
  });
}

// ─── INIT ──────────────────────────────────────────────────────────────
document.getElementById('topic-search').addEventListener('input', renderTopics);
renderTopics();
// Initial fade-in
setTimeout(() => fadeInAll(document.getElementById('s-topics')), 50);
</script>
